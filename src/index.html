<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokoroten Audio Processor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Tokoroten Audio Processor</h1>
        <div class="header-icons">
            <button id="settings-btn" class="icon-btn">⚙️</button>
            <button id="theme-toggle" class="icon-btn">🌓</button>
        </div>
    </header>
    <main>
        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="audio-processing">音声処理</button>
                <button class="tab-btn" data-tab="pdf-conversion">PDF/CSV変換</button>
            </div>
            
            <!-- 音声処理タブ -->
            <div class="tab-content active" id="audio-processing">
                <h2>AudioSep & FolderMNG</h2>
                <div class="input-group">
                    <input type="text" id="input-dir" placeholder="Select Input Directory" readonly>
                    <button id="select-input-dir">Select</button>
                </div>
                <div class="input-group">
                    <input type="text" id="output-dir" placeholder="Select Output Directory" readonly>
                    <button id="select-output-dir">Select</button>
                </div>
                <div class="input-group">
                    <input type="text" id="target-dir" placeholder="Select Target Base Directory" readonly>
                    <button id="select-target-dir">Select</button>
                </div>
                <div class="process-options">
                    <div class="audio-separation-options">
                        <h3>音源分離オプション</h3>
                        <div class="checkbox-group">
                            <label><input type="checkbox" id="vocals"> Vocals</label>
                            <label><input type="checkbox" id="drums"> Drums</label>
                            <label><input type="checkbox" id="bass"> Bass</label>
                            <label><input type="checkbox" id="other"> Other</label>
                        </div>
                    </div>
                    <div class="file-management-options">
                        <h3>ファイル管理オプション</h3>
                        <div class="checkbox-group">
                            <label><input type="checkbox" id="enable-rename-move"> リネーム＆移動を有効にする</label>
                        </div>
                    </div>
                </div>
                <button id="run-audio" class="primary-btn">Run</button>
                <div id="audio-output" class="output-area">
                    <p>Results will be displayed here...</p>
                </div>
            </div>
            
            <!-- PDF/CSV変換タブ -->
            <div class="tab-content" id="pdf-conversion">
                <h2>PDF/CSV Converter</h2>
                <div class="input-group">
                    <input type="text" id="pdf-file" placeholder="Select PDF File" readonly>
                    <button id="select-pdf-file">Select PDF</button>
                </div>
                <div class="input-group">
                    <input type="text" id="api-key" placeholder="Claude API Key (optional)">
                    <button id="save-api-key">Save Key</button>
                </div>
                <div class="conversion-buttons">
                    <button id="convert-to-markdown" class="primary-btn">PDF → Markdown</button>
                    <button id="convert-to-csv" class="primary-btn" disabled>Markdown → CSV</button>
                </div>
                <div id="markdown-preview" class="preview-area">
                    <h3>Markdown Preview</h3>
                    <div class="preview-content"></div>
                </div>
                <div id="conversion-output" class="output-area">
                    <p>Conversion results will be displayed here...</p>
                </div>
            </div>
        </div>
    </main>
    <script src="renderer.js"></script>
</body>
</html>
